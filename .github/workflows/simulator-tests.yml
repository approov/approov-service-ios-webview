name: iOS simulator regression tests

on:
  push:
    branches: [main, '0.6']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run the real WebKit and native transport regression suite
        run: bash Scripts/test-simulator.sh
      - name: Preserve simulator test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: simulator-test-evidence
          path: .build/simulator-results
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
